global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# No Alertmanager (optional in the spec): alerts are visible in Prometheus and Grafana only.
scrape_configs:
  - job_name: model-service
    static_configs:
      - targets: ["service:8000"]

  # The drift job pushes here; honor_labels keeps the job label it set instead of overwriting it.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
